<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>   
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css">
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
</head>
<body>
    <!-- Forgot Password Form Container -->
    <div class="container2">
        <h1>Forgot Password</h1>
        <p>Please enter your registered email address. We will send a One Time Password(OTP) to the email. Please don't give out this code</p>

        <!-- Email Input Field -->
        <div class="input-field">
            <input type="email" id="user-email" placeholder="Enter your email">
        </div>

        <!-- Submit Button -->
        <button class="login-button" id="submit-button">Submit</button>

        <!-- Back to Login Link -->
        <div class="forgot-password">
            <a href="index.html"><h6>Back to Login</h6></a>
        </div>

        <!-- Output Field -->
        <div id="output"></div>
    </div>
</body>
</html>
