<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS PROJECT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Heading Section -->
    <div class="heading">
        <img src="man-holding-gas.jpeg" alt="gas icon">
        <h1><b>BUSOLAS GAS</b></h1>
        <h6><b>Get Your Gas, Cylinders And Other Accessories Here</b></h6>
    </div>

    <!-- Login Form Container -->
    <div class="container">
        <h1><b>USER LOGIN</b></h1>

        <!-- Login Form -->
        <form action="login.html" method="get">
            <!-- Card Number Field -->
            <div class="input-field">
                <img src="user.jpeg" alt="User icon">
                <input type="text" name="card_number" placeholder="Enter Card Number" required>
            </div>

            <!-- Password Field -->
            <div class="input-field">
                <img src="lock.jpeg" alt="Lock icon">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-button">LOGIN</button>
        </form>
        
        <!-- Forgot Password Link -->
        <div class="forgot-password">
            <a href="forgot-password.html"><b>Forgot password?</b></a>
            <footer> <p>&copy; Dunama003 2025. All rights reserved.</p></footer>
        </div>
    </div>
</body>
</html>
