<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Section</title>
    <link rel="stylesheet" href="others.css">
</head>
<body>
    
    <div class="content">
        <a href="login.html"><b>Back to Login</b></a>
        <div class="calculation-request">
            <h2><b>Gas Sales</b></h2>
            <img src="cylinder.jpeg" alt="stylesheet">
            <label for="calculation-type"><b>Calculate gas in:</b></label>
            <select id="calculation-type" name="calculation-type" onchange="showInputField()">
                <option value="">Select</option>
                <option value="amount">Amount(₦)</option>
                <option value="kilogram">Kilogram(KG)</option>
            </select>
            <div id="input-field" style="margin-top: 20px;">
                <!-- Input field will be displayed here based on selection -->
            </div>
            <div id="result" style="margin-top: 30px;">
                <!-- Result will be displayed here -->
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; Dunama003 2025. All rights reserved.</p>
    <script>
        function showInputField() {
            const calculationType = document.getElementById('calculation-type').value;
            const inputFieldDiv = document.getElementById('input-field');
            inputFieldDiv.innerHTML = ''; // Clear previous input field

            if (calculationType === 'amount') {
                inputFieldDiv.innerHTML = `
                    <label for="amount">Enter Naira:</label>
                    <input type="text" id="amount" name="amount" placeholder="Enter amount in Naira" oninput="calculateGas()">
                `;
            } else if (calculationType === 'kilogram') {
                inputFieldDiv.innerHTML = `
                    <label for="kilogram">Enter Kilogram:</label>
                    <input type="text" id="kilogram" name="kilogram" placeholder="Enter amount in Kilogram" oninput="calculateGas()">
                `;
            }
        }

        function calculateGas() {
            const gasPrice = parseFloat(document.getElementById('gas-price').value);
            const calculationType = document.getElementById('calculation-type').value;
            let result = 0;

            if (calculationType === 'amount') {
                const amount = parseFloat(document.getElementById('amount').value);
                if (!isNaN(gasPrice) && !isNaN(amount)) {
                    result = amount / gasPrice;
                }
            } else if (calculationType === 'kilogram') {
                const kilogram = parseFloat(document.getElementById('kilogram').value);
                if (!isNaN(gasPrice) && !isNaN(kilogram)) {
                    result = kilogram * gasPrice;
                }
            }

            document.getElementById('result').innerText = `Result: ${result.toFixed(2)}`;
        }
    </script>
</body>
</html>
